# Stack de teste que o pipeline sobe a cada build, construído a partir do código do commit em teste.
# Diferenças em relação ao docker-compose.yaml: sem portas no host (evita conflito com o stack local),
# sem volume nomeado no Redis (os dados morrem com o stack) e sem jenkins e mailpit.
services:
  api:
    build: ./api
    environment:
      REDIS_URL: redis://db:6379
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: ./app
      args:
        PUBLIC_EMAILJS_SERVICE_ID: test_service
        PUBLIC_EMAILJS_TEMPLATE_ID: test_template
        PUBLIC_EMAILJS_PUBLIC_KEY: test_public_key
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
