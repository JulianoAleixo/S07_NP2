services:
  jenkins:
    build: ./jenkins
    ports:
      - "8080:8080"
    shm_size: "2gb"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      REPO_URL: ${REPO_URL}
      REPO_BRANCH: ${REPO_BRANCH}
    volumes:
      - jenkins_home:/var/jenkins_home

  api:
    build: ./api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  jenkins_home: