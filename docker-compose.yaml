services:
  jenkins:
    image: julianomaleixo/s07-np2-jenkins:latest
    ports:
      - "8080:8080"
    shm_size: "2gb"
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_ADMIN_ID}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD}
      REPO_URL: ${REPO_URL}
      REPO_BRANCH: ${REPO_BRANCH}
      NOTIFY_EMAIL: ${NOTIFY_EMAIL}
      # Sem SMTP_HOST no .env, o e-mail vai para o Mailpit. Com ele, para um servidor real.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-jenkins@localhost}
    volumes:
      - jenkins_home:/var/jenkins_home
    depends_on:
      app:
        condition: service_healthy
      mailpit:
        condition: service_started

  api:
    build: ./api
    environment:
      REDIS_URL: redis://db:6379
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: ./app
      args:
        PUBLIC_EMAILJS_SERVICE_ID: test_service
        PUBLIC_EMAILJS_TEMPLATE_ID: test_template
        PUBLIC_EMAILJS_PUBLIC_KEY: test_public_key
    ports:
      - "4321:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Passa pelo proxy do nginx: confirma que o app alcança a API.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  db:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.29.6
    ports:
      - "8025:8025"
    environment:
      # Grava os e-mails em arquivo para sobreviverem a reinícios.
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

volumes:
  jenkins_home:
  mailpit_data:
  redis_data:
