server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Em container, o proxy do astro.config.mjs não existe: é o nginx que repassa /api para a API.
    location /api/ {
        proxy_pass http://api:3000;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
